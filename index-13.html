<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yoyi Express</title>
<meta name="theme-color" content="#100E0B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yoyi Express">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&family=Saira+Condensed:wght@600;700&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
/* Marca Yoyi Express: negro, arena y blanco, tomados del logo. */
:root{
  --bg:#F5F2ED; --surface:#FFFFFF; --ink:#17130F; --muted:#6A6155; --line:#E4DDD1;
  --accent:#17130F; --accent-ink:#EDC48A; --accent-soft:#F0E6D6;
  --signal:#E5B574; --signal-ink:#2A1D08; --signal-soft:#F7ECD7;
  --ok:#17794A; --ok-soft:#DDF3E7; --warn:#8A5A00; --warn-soft:#F7E8C8; --bad:#B3261E; --bad-soft:#FBE3E0;
  --head:#100E0B; --head-ink:#F5EFE4; --head-muted:#B7AA96;
  --shadow:0 1px 2px rgba(23,19,15,.08),0 10px 22px -14px rgba(23,19,15,.35);
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-display:'Saira Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0C0A; --surface:#1A1713; --ink:#F2ECE2; --muted:#A89E90; --line:#2E2923;
  --accent:#E5B574; --accent-ink:#1A1208; --accent-soft:#3A2E1C;
  --signal:#E5B574; --signal-ink:#2A1D08; --signal-soft:#3A2F1A;
  --ok:#5ED79B; --ok-soft:#14301F; --warn:#F0C26A; --warn-soft:#352905; --bad:#FF8F86; --bad-soft:#3A1A17;
  --head:#070605; --head-ink:#F5EFE4; --head-muted:#A89B87;
  --shadow:0 1px 0 rgba(255,255,255,.04),0 10px 22px -14px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0C0A; --surface:#1A1713; --ink:#F2ECE2; --muted:#A89E90; --line:#2E2923;
  --accent:#E5B574; --accent-ink:#1A1208; --accent-soft:#3A2E1C;
  --signal:#E5B574; --signal-ink:#2A1D08; --signal-soft:#3A2F1A;
  --ok:#5ED79B; --ok-soft:#14301F; --warn:#F0C26A; --warn-soft:#352905; --bad:#FF8F86; --bad-soft:#3A1A17;
  --head:#070605; --head-ink:#F5EFE4; --head-muted:#A89B87;
  --shadow:0 1px 0 rgba(255,255,255,.04),0 10px 22px -14px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:30}
.app{max-width:560px;margin:0 auto;padding-bottom:150px;min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.big{font-variant-numeric:tabular-nums}

/* encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px)) 16px;
  display:flex;align-items:center;gap:12px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(90deg,var(--signal) 0 22px,transparent 22px 40px)}
.logo{width:52px;height:52px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--signal)}
.logo svg{width:28px;height:28px}
.top h1{margin:0;font:700 26px/1 var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.top small{display:block;font:500 13px var(--font-body);color:var(--head-muted);margin-top:3px}
.top .grow{flex:1;min-width:0}
.tag{font:700 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--head-muted);color:var(--head-muted);border-radius:6px;padding:3px 7px}

h2{margin:26px 0 10px;font:700 21px/1.1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
h2:first-child{margin-top:18px}
.sub{color:var(--muted);font-size:14px}
.muted{color:var(--muted)}

/* selector de día */
.daynav{display:flex;align-items:center;gap:8px;margin-top:16px}
.daynav .lbl{flex:1;min-width:0;text-align:center}
.daynav .lbl b{display:block;font:700 22px/1.1 var(--font-display);letter-spacing:.02em;text-transform:none}
.daynav .lbl span{font-size:13px;color:var(--muted)}
.iconbtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[disabled]{opacity:.35}

/* tarjeta del día */
.hero{margin-top:14px;background:var(--head);color:var(--head-ink);border-radius:20px;padding:18px 16px 16px;box-shadow:var(--shadow)}
.hero .k{font:700 12px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--head-muted)}
.hero .big{font:700 56px/1 var(--font-display);margin:4px 0 12px;letter-spacing:.01em}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini3>div{background:rgba(255,255,255,.07);border-radius:12px;padding:9px 10px;min-width:0}
.mini3 b{display:block;font:700 20px/1.1 var(--font-display);white-space:nowrap}
.mini3 span{font-size:12px;color:var(--head-muted);line-height:1.2;display:block;margin-top:2px}
.mini3 .due b{color:var(--signal)}
.paybar{margin-top:12px;border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.paybar.pend{background:var(--signal-soft);color:var(--ink)}
.paybar.paid{background:var(--ok-soft);color:var(--ok)}
.paybar .t{flex:1;min-width:150px;font-weight:700;font-size:15px;line-height:1.25}
.stick{position:sticky;bottom:-1px;background:var(--surface);padding:10px 0 6px;margin-top:14px;z-index:2}
.misdatos{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:0 14px 12px}.misdatos summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.paybar .pbb{display:flex;gap:8px;flex-wrap:wrap}.papel .pa{text-align:right;flex:none}.papel .pa small{color:#2E7D4F;font-weight:600;font-size:12px}
.paybar .t small{display:block;font-weight:500;opacity:.85;font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{min-width:0}

/* viajes */
.list{display:flex;flex-direction:column;gap:8px}
.trip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-height:68px;box-shadow:var(--shadow);color:inherit}
.trip .hr{flex:none;width:72px;white-space:nowrap;font:600 13px/1.2 var(--font-body);color:var(--muted)}
.trip .tm{flex:1;min-width:0}
.trip .tm b{display:block;font-size:17px;overflow-wrap:anywhere}
.trip .amt{font:700 24px/1 var(--font-display);white-space:nowrap}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.extra{background:var(--signal-soft);color:var(--warn)}
.pill.cash{background:var(--ok-soft);color:var(--ok)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:30px 14px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* tarjetas generales */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;padding:12px 14px;border:1px solid var(--line)}.crow .cm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.crow .cm b{font:700 19px/1.1 var(--font-display);letter-spacing:.02em}.crow .amt{font:700 24px/1 var(--font-display);white-space:nowrap}.crow svg{width:18px;height:18px;flex:none;opacity:.5}
.cobro{display:flex;flex-direction:column;gap:10px}
.cobro .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cobro .r1 b{font:700 20px/1.1 var(--font-display);text-transform:none;letter-spacing:.02em}
.cobro .amt{font:700 26px/1 var(--font-display);white-space:nowrap}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);min-width:0}
.kpi b{display:block;font:700 28px/1.05 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.good b{color:var(--ok)}.kpi.bad b{color:var(--bad)}
.bigcard{background:var(--head);color:var(--head-ink);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.bigcard .k{font:700 12px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--head-muted)}
.bigcard .big{font:700 46px/1 var(--font-display);margin-top:4px}
.bigcard .big.due{color:var(--signal)}
.bigcard p{margin:6px 0 0;color:var(--head-muted);font-size:14px}

/* barras */
.hb{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.hb .tr{height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:8px;background:var(--accent)}
.hb.best .tr i{background:var(--signal)}
.hb em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hb b{font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart text{font:600 10px var(--font-body);fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.best{fill:var(--signal)}
.chart .ax{fill:var(--muted)}
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 17px var(--font-display);flex:none}
.rank:first-child .n{background:var(--signal);color:var(--signal-ink)}
.rank .m{flex:1;min-width:0}
.rank .m b{display:block;text-transform:none}
.rank .a{font:700 20px var(--font-display);white-space:nowrap}
.take{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--signal-soft);color:var(--ink);font-size:15px}
.take b{color:var(--warn)}

/* moto */
.odo{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap}
.odo span{font:700 40px/1 var(--font-display);background:#05080C;color:var(--signal);border-radius:7px;padding:8px 8px 6px;min-width:34px;text-align:center;box-shadow:inset 0 -8px 10px rgba(255,255,255,.06)}
.odo em{font:600 14px var(--font-body);font-style:normal;color:var(--head-muted);margin-left:8px;padding-bottom:6px}
.mitem{display:flex;flex-direction:column;gap:8px}
.mitem .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mitem .r1 b{font-size:17px}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ok)}
.gauge i.pronto{background:#E0A100}.gauge i.vencido{background:var(--bad)}
.gauge::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--surface) calc(10% - 2px) 10%)}
.gl2{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.hist{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist .d{width:56px;flex:none;font-size:13px;color:var(--muted);font-weight:600}
.hist .m{flex:1;min-width:0}
.hist .m b{display:block}
.hist .c{font:700 17px var(--font-display);white-space:nowrap}

/* movimientos */
.mv{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mv:last-child{border-bottom:0}
.mv .d{width:52px;flex:none;font-size:13px;color:var(--muted);font-weight:600}
.mv .m{flex:1;min-width:0}
.mv .m b{display:block}
.mv .a{font:700 19px var(--font-display);white-space:nowrap}
.mv .a.in{color:var(--ok)}
.mv .x{width:44px;height:44px;border-radius:12px;border:0;background:var(--bg);color:var(--muted);display:grid;place-items:center;flex:none}
.mv .x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.monthnav{display:flex;align-items:center;gap:8px;margin-top:16px}
.monthnav .lbl{flex:1;text-align:center;font:700 22px var(--font-display);text-transform:none;letter-spacing:.02em}

/* chips y formularios */
.chipbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.quick .chip{min-height:44px;padding:0 14px}
label.f{display:block;margin:14px 0 6px;font-weight:700;font-size:14px}
.in{width:100%;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px;color:var(--ink)}
.in.money{font:700 24px var(--font-display);letter-spacing:.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:15px;padding:0 8px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:8px;margin-top:8px;align-items:center}
.exrow .x{width:44px;height:48px;border-radius:12px;border:0;background:var(--bg);color:var(--muted)}
.locrow{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}
.locrow .grow{flex:1;min-width:0}
.locrow .x{width:44px;height:52px;border-radius:12px;border:0;background:var(--bg);color:var(--muted);display:grid;place-items:center;flex:none}
.locrow .x svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sumbox{margin-top:14px;border-radius:14px;background:var(--bg);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.sumbox div{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.sumbox .tt{font:700 26px/1.1 var(--font-display);border-top:2px solid var(--ink);padding-top:8px;margin-top:4px}
.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.err{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:14px}

/* navegación y hojas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);box-shadow:0 -10px 24px -16px rgba(0,0,0,.45);
  display:flex;padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-right,0px))}
.nav button{flex:1;min-width:0;min-height:64px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fab{position:fixed;z-index:24;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));min-height:58px;padding:0 22px 0 18px;border-radius:29px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 24px -10px var(--accent)}
[hidden]{display:none!important}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(8,12,17,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:94dvh;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font:700 26px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.sheet textarea.in{padding:12px;min-height:110px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;z-index:60;font-weight:700;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(22px);opacity:0}}}
.meta{margin-top:12px}.meta .mt{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--head-muted)}.meta .mt b{color:var(--head-ink);font-weight:700}
.meta .mb{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}.meta .mb i{display:block;height:100%;background:var(--signal);border-radius:99px}
.lnk{background:none;border:0;color:var(--head-muted);font-size:13px;font-weight:600;padding:10px 0 2px;text-decoration:underline;min-height:40px}
.alerta{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 6px 10px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn)}
.alerta .grow{flex:1;min-width:0;font-size:14px;line-height:1.3}.alerta b{display:block;font-size:15px}
.alerta .x{width:44px;height:44px;border:0;background:transparent;color:inherit;display:grid;place-items:center;flex:none}.alerta .x svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

<body>

<div class="app" id="app"></div>
<button class="fab" id="fab" data-act="newTrip" aria-label="Anotar viaje nuevo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Anotar viaje</button>

<div id="layer"></div>
<div id="toast" class="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS3=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const INI=['D','L','M','X','J','V','S'];
const hoyD=new Date(); hoyD.setHours(0,0,0,0);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const toD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const off=n=>{const d=new Date(hoyD);d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>Math.round((toD(s)-hoyD)/864e5);
const HOY=iso(hoyD);
const addDias=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return iso(d)};
const col=n=>'₡'+Math.round(n).toLocaleString('en-US').replace(/,/g,' ');
const kmf=n=>Math.round(n).toLocaleString('en-US').replace(/,/g,' ');
const num=s=>Number(String(s==null?'':s).replace(/[^\d]/g,''))||0;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fLargo=s=>{const d=toD(s);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]};
const fCorto=s=>{const d=toD(s);return d.getDate()+' '+MES3[d.getMonth()]};
const h12=t=>{if(!t)return'';const [h,m]=t.split(':').map(Number);return ((h%12)||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'a. m.':'p. m.')};
const hace=s=>{const d=-diff(s);return d===0?'hoy':d===1?'ayer':'hace '+d+' días'};

/* ---------- iconos ---------- */
const I={
 hoy:'<path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>',
 cobros:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M16 15h2"/>',
 dinero:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.4-.8-1.300-1.200-2.500-1.200-1.500 0-2.500.7-2.500 1.800s1 1.600 2.500 1.900 2.500.8 2.500 1.900-1 1.800-2.500 1.800c-1.200 0-2.100-.4-2.500-1.200M12 6.500V8M12 16v1.500"/>',
 moto:'<circle cx="6" cy="16.500" r="3.200"/><circle cx="18" cy="16.500" r="3.200"/><path d="M6 16.500l3.500-6h5.500l3 6M9.500 10.500L8.500 7.500H6M15 10.500l1.500-3H19"/>',
 datos:'<path d="M5 20V11M12 20V4M19 20v-6"/>',
 izq:'<path d="M15 5l-7 7 7 7"/>', der:'<path d="M9 5l7 7-7 7"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>', mas:'<path d="M12 5v14M5 12h14"/>',
 copia:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
 ok:'<path d="M5 12.500l4.500 4.500L19 7.500"/>'
};
const ic=(k,c)=>`<svg viewBox="0 0 24 24" aria-hidden="true"${c?` class="${c}"`:''}>${I[k]}</svg>`;

/* ---------- datos de ejemplo ---------- */
const KEY='pura-ruta-v1';
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function inicio(){
  const mk=(id,nombre,cada)=>({id,nombre,tipo:'km',cada,ultimoKm:0});
  const y=hoyD.getFullYear();
  return{locales:[{id:1,nombre:'Mi primer local'}],viajes:[],dias:{},movs:[],
    moto:{km:0,items:[mk(1,'Cambio de aceite',3000),mk(2,'Lubricar cadena',500),mk(3,'Pastillas de freno',8000),mk(4,'Filtro de aire',6000),mk(5,'Bujía',8000),mk(6,'Revisión de llantas',12000),mk(7,'Kit de arrastre (cadena y piñones)',18000),
      {id:8,nombre:'Marchamo',tipo:'fecha',vence:(iso(new Date(y,11,31))>=HOY?y:y+1)+'-12-31',cadaDias:365}],hist:[]},
    nid:{v:1,m:1,i:9,h:1,l:2}}}
const temaAct=()=>{try{return localStorage.getItem('pura-ruta-tema')||'auto'}catch(e){return 'auto'}};
function aplicaTema(){const t=temaAct();if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#F3EEE6':'#100E0B'}
aplicaTema();
let S;
function cargar(){try{const t=localStorage.getItem(KEY);if(t){const d=JSON.parse(t);if(d&&d.viajes&&d.locales)return d}}catch(e){}return inicio()}
function guardar(){_ix=null;S._v=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof sync!=='undefined'&&sync.user){marcarSucio(1);progPush()}}
S=cargar();
const ui={tab:'hoy',fecha:HOY,rango:28,mes:0,confirm:null};

/* ---------- cálculos ---------- */
const exV=v=>(v.extras||[]).reduce((s,e)=>s+(Number(e.p)||0),0);
const totV=v=>(Number(v.monto)||0)+exV(v);
const cobV=v=>Number(v.efectivo)||0;
const vueV=()=>0;
const lidV=v=>v.lid||S.locales[0].id;
const LN=id=>(S.locales.find(l=>l.id==id)||{nombre:'Local'}).nombre;
const kd=(f,l)=>f+'|'+l;
let _ix=null,_ixS=null,_ixN=0,_tg=null,_pn=null,_cs=null;
function ix(){if(_ix&&_ixS===S&&_ixN===S.viajes.length)return _ix;const m=new Map();for(const v of S.viajes){let a=m.get(v.fecha);if(!a)m.set(v.fecha,a=[]);a.push(v)}m.forEach(a=>a.sort((x,y)=>(x.hora||'').localeCompare(y.hora||'')));_ix=m;_ixS=S;_ixN=S.viajes.length;_tg=null;_pn=null;_cs=null;return m}
const viajesDe=(f,l)=>{const a=ix().get(f)||[];return l==null?a:a.filter(v=>lidV(v)==l)};
function resumenDia(f,l){const vs=viajesDe(f,l);const total=vs.reduce((s,v)=>s+totV(v),0),ext=vs.reduce((s,v)=>s+exV(v),0),fees=total,efe=vs.reduce((s,v)=>s+cobV(v),0);
  const d=l==null?{pagado:false}:(S.dias[kd(f,l)]||{pagado:false}),debe=fees-efe,ab=d.abonos||[],abon=ab.reduce((x,a)=>x+(Number(a.m)||0),0),cub=debe>0&&abon>=debe&&vs.length>0;
  return{vs,n:vs.length,total,ext,fees,efe,debe,abon,abonos:ab,saldo:debe>0?Math.max(0,debe-abon):debe,pagado:!!d.pagado||cub,fechaPago:d.fechaPago||(cub&&ab.length?ab[ab.length-1].f:undefined)}}
const fechasConViajes=()=>[...ix().keys()].sort();
const gruposDia=f=>[...new Set(viajesDe(f).map(lidV))].map(l=>({l,...resumenDia(f,l)}));
const todosGrupos=()=>{ix();if(_tg)return _tg;const o=[];fechasConViajes().forEach(f=>gruposDia(f).forEach(g=>o.push({f,...g})));return _tg=o};
const pendientes=()=>{const t=todosGrupos();return _pn||(_pn=t.filter(d=>d.saldo!==0&&!d.pagado))};
function marcarPago(f,l,si){const k=kd(f,l),o=S.dias[k]||{},ab=o.abonos||[];
  if(si)S.dias[k]={pagado:true,fechaPago:HOY,abonos:ab};
  else{const r=resumenDia(f,l);S.dias[k]={pagado:false,abonos:(r.debe>0&&r.abon>=r.debe)?[]:ab}}guardar()}
function diaE(f,l){const k=kd(f,l);const d=S.dias[k]||(S.dias[k]={pagado:false});if(!d.abonos)d.abonos=[];return d}
const pendLocal=l=>pendientes().filter(d=>d.l==l&&d.saldo>0)
function cuentaTexto(f,l){const r=resumenDia(f,l);
  const L=r.vs.map((v,i)=>(i+1)+'. '+h12(v.hora)+' · '+v.cliente+' · '+col(v.monto)+(v.extras||[]).map(e=>' + '+e.n+' '+col(e.p)).join('')+(cobV(v)?' (pagó '+col(cobV(v))+' en efectivo)':''));
  return 'Cuenta del '+fLargo(f)+' · '+LN(l)+'\n\n'+L.join('\n')+'\n\nTotal de viajes: '+col(r.fees)+'\nEfectivo cobrado a clientes: '+col(r.efe)+(r.abon?'\nAbonos recibidos: '+col(r.abon):'')+'\n'+(r.debe>0&&r.saldo===0?'Cuenta saldada':r.saldo>0?(r.abon?'Saldo pendiente: ':'Total a pagar: ')+col(r.saldo):r.saldo<0?'Total a entregar al local: '+col(-r.saldo):'Cuentas claras')}
const lunesDe=f=>addDias(f,-((toD(f).getDay()+6)%7));
function resumenSemana(l,lun){const dias=[];let total=0,efe=0,n=0,ext=0,cerrado=0,pend=0;
  for(let i=0;i<7;i++){const f=addDias(lun,i);if(f>HOY)break;const r=resumenDia(f,l);dias.push({f,...r});total+=r.total;efe+=r.efe;n+=r.n;ext+=r.ext;
    if(l!=null&&r.n){if(r.pagado)cerrado+=Math.max(0,r.debe);else{pend+=r.saldo;if(r.debe>0)cerrado+=r.abon}}}
  return{dias,total,efe,n,ext,cerrado,pend}}
/* ---------- cuenta de cobro ---------- */
function facDatos(f,l,fechas){const ac=!!(fechas&&fechas.length),F=ac?[...fechas].sort():[f],R=F.map(x=>resumenDia(x,l)),vs=[].concat(...R.map(r=>r.vs));
  const base=vs.reduce((x,v)=>x+(Number(v.monto)||0),0),sum=k=>R.reduce((x,r)=>x+r[k],0),pend=R.reduce((x,r)=>x+r.saldo,0);
  const filas=ac?R.map((r,i)=>{const nt=[];if(r.efe)nt.push('efectivo −'+col(r.efe));if(r.abon)nt.push('abonó −'+col(r.abon));
      nt.unshift('Cuenta '+col(r.total));const pd=Math.max(0,r.saldo);
      return{tit:DIAS3[toD(F[i]).getDay()]+' '+fCorto(F[i]),sub:r.n+(r.n===1?' viaje':' viajes'),tx:DIAS3[toD(F[i]).getDay()]+' '+fCorto(F[i])+' · '+r.n+(r.n===1?' viaje':' viajes')+' · pendiente '+col(pd),monto:pd,nota:nt.join(' · ')}})
    :vs.map(v=>({tit:v.cliente||'Cliente',sub:h12(v.hora)+((v.extras||[]).length?' · '+v.extras.map(e=>e.n+' '+col(e.p)).join(', '):''),
      tx:h12(v.hora)+' · '+(v.cliente||'Cliente')+' · '+col(Number(v.monto)||0)+((v.extras||[]).length?' + '+v.extras.map(e=>e.n+' '+col(e.p)).join(', '):'')+' = '+col(totV(v)),monto:totV(v),nota:cobV(v)?'Pagó '+col(cobV(v))+' en efectivo':''}));
  return{f:F[0],fin:F[F.length-1],l,acum:ac,vs,filas,base,ext:sum('ext'),total:sum('total'),efe:sum('efe'),abon:sum('abon'),debe:ac?pend:R[0].saldo,pagado:R.every(r=>r.pagado),
    num:ac?F[0].replace(/-/g,'')+'-'+F[F.length-1].replace(/-/g,'')+'-'+l:f.replace(/-/g,'')+'-'+l,
    fecTxt:ac?(F.length>1?fCorto(F[0])+' al '+fCorto(F[F.length-1]):fLargo(F[0])):fLargo(f),titulo:ac?'CUENTA ACUMULADA':'CUENTA DE COBRO',
    quien:(S.nombre||'').trim(),tel:(S.tel||'').trim(),sinpe:(S.sinpe||'').trim(),local:LN(l)}}
function facTexto(d){const L=d.filas.map((x,i)=>(i+1)+'. '+x.tx+(x.nota?' ('+x.nota+')':''));
  return (d.acum?'CUENTA ACUMULADA N° ':'CUENTA DE COBRO N° ')+d.num+'\n'+(d.quien||'Servicio express')+(d.tel?' · '+d.tel:'')+'\nPara: '+d.local+'\n'+(d.acum?'Período: ':'Fecha: ')+d.fecTxt+'\n\n'+L.join('\n')+'\n\n'+(d.acum?'':'Viajes: '+col(d.base)+(d.ext?'\nExtras: '+col(d.ext):'')+'\nTotal de servicios: '+col(d.total)+(d.efe?'\nEfectivo que ya cobré a clientes: -'+col(d.efe):'')+(d.abon?'\nAbonos recibidos: -'+col(d.abon):'')+'\n')+(d.debe>0?(d.acum?'PENDIENTE POR PAGAR: ':'TOTAL A PAGAR: ')+col(d.debe):d.debe<0?'A FAVOR DEL LOCAL (se le entrega): '+col(-d.debe):'CUENTA SALDADA')+(d.sinpe&&d.debe>0?'\n\nPago por SINPE Móvil al '+d.sinpe+(d.quien?' ('+d.quien+')':''):'')+'\n\nGracias.'}
function facHtml(d){return `<div class="papel"><div class="ph"><b>${d.titulo}</b><span>N° ${d.num}</span></div>
  <div class="pq"><div><small>De</small><b>${esc(d.quien||'Servicio express')}</b>${d.tel?`<span>${esc(d.tel)}</span>`:''}</div><div><small>Para</small><b>${esc(d.local)}</b><span>${d.fecTxt}</span></div></div>
  <div class="pt">${d.filas.map((x,i)=>`<div class="pr"><span class="pn">${i+1}</span><span class="pc"><b>${esc(x.tit)}</b><small>${esc(x.sub)}</small></span><span class="pa">${col(x.monto)}${x.nota?`<small class="pnota">${esc(x.nota)}</small>`:''}</span></div>`).join('')}</div>
  <div class="ps">${d.acum?'':`<div><span>Viajes</span><b>${col(d.base)}</b></div>${d.ext?`<div><span>Extras</span><b>${col(d.ext)}</b></div>`:''}<div><span>Total de servicios</span><b>${col(d.total)}</b></div>${d.efe?`<div><span>Efectivo ya cobrado a clientes</span><b>−${col(d.efe)}</b></div>`:''}${d.abon?`<div><span>Abonos recibidos</span><b>−${col(d.abon)}</b></div>`:''}`}
  <div class="pg"><span>${d.debe>0?(d.acum?'Pendiente por pagar':'Total a pagar'):d.debe<0?'A favor del local':'Cuenta saldada'}</span><b>${d.debe===0?'₡0':col(Math.abs(d.debe))}</b></div>${d.sinpe&&d.debe>0?`<div class="psp"><span>Pagar por SINPE Móvil al</span><b>${esc(d.sinpe)}</b></div>`:''}</div></div>`}
const facGet=()=>ui.fac.acum?facDatos(null,ui.fac.l,ui.fac.acum):facDatos(ui.fac.f,ui.fac.l);
function facSheet(f,l,acum){const d=acum?facDatos(null,l,acum):facDatos(f,l);ui.fac={f,l,acum};
  const opc=acum?pendLocal(l).map(x=>x.f):[];
  const sel=acum?`<label class="f">Días que incluye la cuenta</label><div class="quick" style="margin-top:0">${opc.map(x=>`<button class="chip" type="button" data-act="acumTog" data-f="${x}" aria-pressed="${acum.includes(x)}">${DIAS3[toD(x).getDay()]} ${fCorto(x)}</button>`).join('')}</div>`:'';
  abrir(`<h3>${acum?'Cuenta acumulada':'Cuenta de cobro'}</h3>${sel}<div id="fac-prev">${facHtml(d)}</div>
  <div class="row stick" style="margin-top:14px"><button class="btn primary" data-act="facImg" style="flex:1 1 100%">Enviar como imagen</button><button class="btn" data-act="facWa" style="flex:1">WhatsApp (texto)</button><button class="btn" data-act="facCopia" style="flex:1">${ic('copia')} Copiar</button></div>
  <details class="misdatos"${(S.nombre&&S.tel)?'':' open'}><summary>Mis datos en la cuenta</summary>
  <label class="f" for="f-fn">Tu nombre</label><input class="in" id="f-fn" data-f="fnom" value="${esc(S.nombre||'')}" placeholder="Ej: Yoyi Express" autocomplete="name">
  <label class="f" for="f-ft">Tu teléfono (opcional)</label><input class="in" id="f-ft" data-f="ftel" type="tel" value="${esc(S.tel||'')}" placeholder="Ej: 8888 8888" autocomplete="tel">
  <label class="f" for="f-fs">Tu SINPE Móvil (opcional)</label><input class="in" id="f-fs" data-f="fsin" type="tel" value="${esc(S.sinpe||'')}" placeholder="Ej: 8888 8888" autocomplete="off"></details>
  <div class="row" style="margin-top:10px"><button class="btn block ghost" data-act="cerrar" style="flex:1">Cerrar</button></div>`)}
function facCanvas(d){const W=760,pad=36,rh=62,hdr=118,fil=[];if(!d.acum){fil.push(['Viajes',col(d.base)]);if(d.ext)fil.push(['Extras',col(d.ext)]);fil.push(['Total de servicios',col(d.total)]);if(d.efe)fil.push(['Efectivo ya cobrado a clientes','-'+col(d.efe)]);if(d.abon)fil.push(['Abonos recibidos','-'+col(d.abon)])}
  const H=hdr+130+d.filas.length*rh+fil.length*44+140+(d.sinpe&&d.debe>0?60:0),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),F='system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#100E0B';x.fillRect(0,0,W,hdr);
  const lg=document.querySelector('.logo');try{if(lg&&lg.complete&&lg.naturalWidth){x.save();x.beginPath();x.arc(pad+38,hdr/2,38,0,7);x.clip();x.drawImage(lg,pad,hdr/2-38,76,76);x.restore()}}catch(e){}

  try{const {data:meta,error:e0}=await sb.from('pura_ruta').select('updated_at').eq('user_id',sync.user.id).maybeSingle();if(e0)throw e0;
    if(meta&&meta.updated_at&&new Date(meta.updated_at).getTime()<=(S._v||0)){sync.ultimo=Date.now();estado('ok');return}
    const data=meta?await traer():null;
    if(!data){if(hayDatos(S))await push();else estado('ok');return}
    const r=data.datos;if(!valido(r)){estado('ok');return}
    const rv=r._v||new Date(data.updated_at).getTime();
    if(rv>(S._v||0)){usar(r);render()}
    estado('ok')}
  catch(e){sync.err=(e&&(e.message||e.details||e.code))||String(e);estado('error')}}
async function primeraSync(){
  if(!sb||!sync.user)return;
  try{const data=await traer();const r=data&&valido(data.datos)?data.datos:null;
    const vinc=LS('pura-ruta-uid')===sync.user.id;
    if(!r){LS('pura-ruta-uid',sync.user.id);await push();return}
    if(vinc){await pull();return}
    if(!hayDatos(S)){LS('pura-ruta-uid',sync.user.id);usar(r);render();estado('ok');return}
    if(!hayDatos(r)){LS('pura-ruta-uid',sync.user.id);await push();return}
    window.__remoto=r;
    abrir(`<h3>¿Qué datos conservas?</h3><div class="sub">Tu cuenta ya tiene ${r.viajes.length} ${r.viajes.length===1?'viaje':'viajes'} y este teléfono tiene ${S.viajes.length}. No se pueden juntar: elige cuáles quedan.</div>
    <div class="row" style="margin-top:16px"><button class="btn primary block" data-act="usarNube" style="flex:1 1 100%">Usar los de mi cuenta</button><button class="btn block" data-act="usarLocal" style="flex:1 1 100%">Usar los de este teléfono</button></div>`)}
  catch(e){sync.err=(e&&(e.message||e.details||e.code))||String(e);estado('error')}}
function msgAuth(e){const m=(e&&e.message||'').toLowerCase();
  if(m.includes('invalid login'))return 'Correo o contraseña incorrectos.';
  if(m.includes('already registered')||m.includes('already been registered'))return 'Ese correo ya tiene cuenta. Entra con tu contraseña.';
  if(m.includes('at least 6')||m.includes('weak'))return 'La contraseña debe tener al menos 6 caracteres.';
  if(m.includes('email not confirmed'))return 'Falta confirmar tu correo. Revisa tu bandeja.';
  if(m.includes('valid email')||m.includes('invalid email'))return 'Escribe un correo válido.';
  if(!navigator.onLine||m.includes('fetch'))return 'Sin conexión. Intenta de nuevo con internet.';
  return 'No se pudo entrar. Intenta de nuevo.'}
function loginSheet(keep){if(!keep)draft={modo:'entrar',email:'',pass:''};const nuevo=draft.modo==='crear';
  abrir(`<h3>${nuevo?'Crear cuenta':'Iniciar sesión'}</h3><div class="sub">Con la misma cuenta ves tus viajes y cobros en cualquier teléfono.</div>
  <label class="f" for="f-em">Correo</label><input class="in" id="f-em" type="email" data-f="email" value="${esc(draft.email)}" autocomplete="email" inputmode="email" placeholder="tu@correo.com">
  <label class="f" for="f-pw">Contraseña</label><input class="in" id="f-pw" type="password" data-f="pass" value="${esc(draft.pass)}" autocomplete="${nuevo?'new-password':'current-password'}" placeholder="${nuevo?'Mínimo 6 caracteres':'Tu contraseña'}">
  <div id="f-err"></div>
  <div class="row" style="margin-top:16px"><button class="btn primary" data-act="entrar" style="flex:1 1 100%">${nuevo?'Crear cuenta':'Entrar'}</button></div>
  <div class="row" style="margin-top:10px"><button class="btn block ghost" data-act="modoLogin" data-v="${nuevo?'entrar':'crear'}" style="flex:1 1 100%">${nuevo?'Ya tengo cuenta':'No tengo cuenta, crear una'}</button><button class="btn block ghost" data-act="ahoraNo" style="flex:1 1 100%">Ahora no, solo en este teléfono</button></div>`)}
async function entrar(){
  const em=(draft.email||'').trim(),pw=draft.pass||'',nuevo=draft.modo==='crear',err=m=>{$('#f-err').innerHTML='<div class="err">'+m+'</div>'};
  if(!em||!pw){err('Escribe tu correo y tu contraseña.');return}
  const b=document.querySelector('[data-act=entrar]');if(b){b.disabled=true;b.textContent='Un momento…'}
  try{const r=nuevo?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error)throw r.error;
    if(!r.data.session){const x=$('#f-err');abrir(`<h3>Revisa tu correo</h3><div class="sub">Te enviamos un mensaje para confirmar la cuenta. Después de confirmar, vuelve y entra con tu correo y contraseña.</div><div class="row" style="margin-top:16px"><button class="btn primary block" data-act="cerrar" style="flex:1 1 100%">Entendido</button></div>`);return}
    sync.user=r.data.user;LS('pura-ruta-skip',null);cerrar();toast('Sesión iniciada');render();await primeraSync()}
  catch(e){if(b){b.disabled=false;b.textContent=nuevo?'Crear cuenta':'Entrar'}err(msgAuth(e))}}
Object.assign(A,{
 loginSheet:()=>loginSheet(),
 modoLogin:d=>{draft.modo=d.v;loginSheet(true)},
 entrar:()=>entrar(),
 ahoraNo:()=>{LS('pura-ruta-skip','1');cerrar()},
 sincronizar:async()=>{toast('Sincronizando…');if(sucio())await push();else await pull();toast(sync.estado==='ok'?'Todo al día':'No se pudo sincronizar');render()},
 salir:async()=>{try{await sb.auth.signOut()}catch(e){}sync.user=null;sync.estado='';LS('pura-ruta-uid',null);marcarSucio(0);LS('pura-ruta-skip','1');toast('Sesión cerrada');render()},
 usarNube:()=>{if(window.__remoto){LS('pura-ruta-uid',sync.user.id);usar(window.__remoto);window.__remoto=null}cerrar();render();estado('ok');toast('Datos de tu cuenta')},
 usarLocal:async()=>{LS('pura-ruta-uid',sync.user.id);cerrar();S._v=Date.now();guardar();toast('Subiendo los de este teléfono')}
});
async function initSync(){
  if(!(await cargarSB()))return;
  try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'pura-ruta-auth'}})}catch(e){sb=null}
  if(!sb)return;
  try{const {data}=await sb.auth.getSession();if(data&&data.session)sync.user=data.session.user}catch(e){}
  sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='SIGNED_OUT'&&sync.user){sync.user=null;render()}});
  if(sync.user){render();if(sucio())push();else if(LS('pura-ruta-uid')===sync.user.id)pull();else primeraSync()}
  else if(!LS('pura-ruta-skip')&&!S.viajes.length)loginSheet();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sync.user){sucio()?push():pull()}});
  window.addEventListener('online',()=>{if(sync.user)sucio()?push():pull()});
  window.addEventListener('offline',()=>{if(sync.user)estado('offline')});
  setInterval(()=>{if(!document.hidden&&sync.user)pull()},60000);if(!sync.user&&ui.tab==='datos')render()}

render();initSync();
const BUILD="1792390123";
if("serviceWorker" in navigator){window.addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js").then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update()})})}catch(e){}})}
async function hayNueva(){try{const t=await (await fetch("index.html?v="+Date.now(),{cache:"no-store"})).text();const m=t.match(/const BUILD="(\d+)"/);return !!m&&m[1]!==BUILD}catch(e){return false}}
let _rec=0;async function buscaNueva(){if(document.hidden||_rec)return;if(await hayNueva()){if(document.querySelector("#layer .sheet")||(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))return;_rec=1;toast("Actualizando la app…");setTimeout(()=>location.reload(),900)}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)setTimeout(buscaNueva,800)});
setTimeout(buscaNueva,4000);setInterval(buscaNueva,300000);
</script>
